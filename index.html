<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Coffee & Accessories</title>
    <style>
        /* Basic Reset */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, sans-serif;
        }

        body {
            background-color: #f7f7f7;
        }

        /* Header */
        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background-color: white;
            padding: 10px 20px;
            border-bottom: 1px solid #ccc;
        }

        header .logo {
            font-size: 24px;
            font-weight: bold;
            color: #333;
        }

        header .search-container {
            display: flex;
            gap: 10px;
        }

        header .search-container input {
            padding: 8px;
            width: 200px;
        }

        header .search-container button {
            padding: 8px 15px;
            background-color: #0064D2;
            color: white;
            border: none;
            cursor: pointer;
        }

        /* Promo Banner */
        .promo-banner {
            background-color: #6d4c41;
            color: white;
            text-align: center;
            padding: 20px;
            margin: 20px 0;
        }

        /* Products Section */
        .products-wrapper {
            display: flex;
            justify-content: space-around;
            gap: 20px;
            padding: 20px;
            flex-wrap: wrap; /* Allows wrapping of product cards on smaller screens */
        }

        .product-card {
            background-color: white;
            padding: 15px;
            text-align: center;
            border: 1px solid #ddd;
            width: 200px;
            flex: 1;
            margin: 10px;
            box-shadow: 0 2px 5px rgba(0, 0, 0, 0.1);
        }

        .product-image {
            font-size: 50px;
            margin-bottom: 10px;
        }

        .price {
            font-weight: bold;
            margin-top: 10px;
        }

    </style>
</head>
<body>

    <!-- Header -->
    <header>
        <div class="logo">Coffee Shop</div>
        <div class="search-container">
            <input type="text" placeholder="Search for coffee gear">
            <button>Search</button>
        </div>
    </header>

    <!-- Promo Banner -->
    <section class="promo-banner">
        <h1>Special Coffee Deals</h1>
        <p>Up to 50% Off on Coffee Makers & Accessories</p>
    </section>

    <!-- Products Section -->
    <section class="products-wrapper">
        <div class="product-card">
            <div class="product-image">☕</div>
            <h3>Espresso Machine</h3>
            <div class="price">$199.00</div>
        </div>

        <div class="product-card">
            <div class="product-image">🌱</div>
            <h3>Coffee Grinder</h3>
            <div class="price">$59.00</div>
        </div>

        <div class="product-card">
            <div class="product-image">🧃</div>
            <h3>Coffee Mug Set</h3>
            <div class="price">$25.00</div>
        </div>

        <div class="product-card">
            <div class="product-image">🍩</div>
            <h3>Coffee Filter Pack</h3>
            <div class="price">$12.00</div>
        </div>
    </section>

</body>
</html>
